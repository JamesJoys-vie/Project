name: tuition-payment

x-svc-health: &svc-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 20s

services:
  # ---------------- infrastructure ----------------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # max-connections: user + tuition (30 each) + payment (4 workers x 15) + seed/tools, with headroom
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=300
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      TUITION_DB_PASSWORD: ${TUITION_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"   # host access for GUI tools / seed; not exposed by Ngrok
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/infra/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis = OTP store (TTL keys) + event bus (Streams). AOF keeps stream events across restarts.
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ---------------- microservices ----------------
  user-service:
    build: { context: ./backend, args: { SERVICE_DIR: services/user_service } }
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://user_svc:${USER_DB_PASSWORD}@mysql:3306/users_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck: *svc-health

  tuition-service:
    build: { context: ./backend, args: { SERVICE_DIR: services/tuition_service } }
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://tuition_svc:${TUITION_DB_PASSWORD}@mysql:3306/tuition_db
      RESERVATION_TTL_SECONDS: ${RESERVATION_TTL_SECONDS:-600}
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck: *svc-health

  otp-service:
    build: { context: ./backend, args: { SERVICE_DIR: services/otp_service } }
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
    depends_on:
      redis: { condition: service_healthy }
    healthcheck: *svc-health

  payment-service:
    build: { context: ./backend, args: { SERVICE_DIR: services/payment_service } }
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://payment_svc:${PAYMENT_DB_PASSWORD}@mysql:3306/payments_db
      USER_SERVICE_URL: http://user-service:8000
      TUITION_SERVICE_URL: http://tuition-service:8000
      OTP_SERVICE_URL: http://otp-service:8000
      REDIS_URL: redis://redis:6379/0
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      # CPU-bound under load (Phase 5): several processes. Workers (outbox relay, expiry job) are replica-safe.
      UVICORN_WORKERS: ${PAYMENT_WORKERS:-4}
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 10
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      user-service: { condition: service_healthy }
      tuition-service: { condition: service_healthy }
      otp-service: { condition: service_healthy }
    healthcheck: *svc-health

  notification-service:
    build: { context: ./backend, args: { SERVICE_DIR: services/notification_service } }
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      redis: { condition: service_healthy }
    healthcheck: *svc-health

  gateway:
    build: { context: ./backend, args: { SERVICE_DIR: gateway } }
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:8000
      TUITION_SERVICE_URL: http://tuition-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      REDIS_URL: redis://redis:6379/0   # rate-limit counters
    depends_on:
      redis: { condition: service_healthy }
      user-service: { condition: service_healthy }
      tuition-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
    healthcheck: *svc-health

  # ---------------- web (React build + nginx, proxies /api -> gateway) ----------------
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    depends_on:
      gateway: { condition: service_healthy }

  # ---------------- optional profiles ----------------
  ngrok:                      # docker compose --profile public up
    image: ngrok/ngrok:latest
    profiles: ["public"]
    restart: unless-stopped
    command: http --domain=${NGROK_DOMAIN} web:80
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on: [web]

  seed:                       # docker compose --profile tools run --rm seed
    build: { context: ./backend, args: { SERVICE_DIR: scripts } }
    profiles: ["tools"]
    entrypoint: ["python", "seed.py"]
    environment:
      USERS_DB_URL: mysql+pymysql://user_svc:${USER_DB_PASSWORD}@mysql:3306/users_db
      TUITION_DB_URL: mysql+pymysql://tuition_svc:${TUITION_DB_PASSWORD}@mysql:3306/tuition_db
      PAYMENTS_DB_URL: mysql+pymysql://payment_svc:${PAYMENT_DB_PASSWORD}@mysql:3306/payments_db
    depends_on:
      user-service: { condition: service_healthy }
      tuition-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }

volumes:
  mysql_data:
  redis_data:
